<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f9e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Lançamentos LC</title>
<style>
:root{--bg:#f2f3f0;--panel:#fff;--ink:#15191b;--ink2:#4c5357;--ink3:#7c8387;--line:#dcdfda;--soft:#eceee9;--accent:#1f5f9e;--good:#1d7a3e;--goodbg:#e2f2e7;--warn:#9a6200;--warnbg:#fbefd6;--bad:#b42d2c;--badbg:#f9e1e0;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--num:ui-monospace,"SF Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121516;--panel:#1b1f21;--ink:#eef0ee;--ink2:#b5bbbd;--ink3:#868d90;--line:#2e3437;--soft:#252a2c;--accent:#7fb0e6;--good:#6cc98b;--goodbg:#1a2e21;--warn:#e3b153;--warnbg:#33291a;--bad:#ef8584;--badbg:#3a2020;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);padding:env(safe-area-inset-top,0) 0 calc(70px + env(safe-area-inset-bottom,0))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}h1 span{color:var(--accent)}
.net{font-size:12px;font-weight:700;border-radius:12px;padding:3px 9px;white-space:nowrap}
.net.on{background:var(--goodbg);color:var(--good)}.net.off{background:var(--warnbg);color:var(--warn)}
main{padding:12px 16px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;display:grid;gap:12px}
h2{margin:0;font-size:17px}
label{display:grid;gap:4px;font-size:13px;color:var(--ink2);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;font-size:16px;width:100%;min-width:0}
textarea{min-height:58px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.lbl{font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 50px 84px 26px;gap:6px;align-items:center}
.item input{padding:9px 7px}
.x{border:0;background:none;color:var(--ink3);font-size:20px;padding:2px}
.add{justify-self:start;border:1px dashed var(--line);background:none;border-radius:7px;padding:7px 12px;color:var(--accent);font-weight:600}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.tot b{font:500 22px var(--num)}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--panel);font-weight:700;font-size:16px;padding:13px}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:14px;padding:9px 12px;font-weight:600}
.btn:disabled{opacity:.5}
.msg{font-size:14px;font-weight:600;padding:9px 11px;border-radius:7px}
.msg.ok{background:var(--goodbg);color:var(--good)}.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--warnbg);color:var(--warn)}
.foto{display:flex;gap:10px;align-items:center}
.foto img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{border:0;background:none;padding:10px 4px 12px;font-size:13px;font-weight:700;color:var(--ink3);display:grid;gap:2px;justify-items:center}
nav button[aria-selected="true"]{color:var(--accent)}
nav i{font-style:normal;font-size:19px;line-height:1}
.badge{display:inline-block;min-width:18px;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;margin-left:3px}
.lanc{border:1px solid var(--line);border-left:4px solid var(--ink3);border-radius:8px;padding:10px 12px;background:var(--panel);display:grid;gap:3px}
.lanc.fila{border-left-color:var(--warn)}.lanc.enviado{border-left-color:var(--accent)}.lanc.lancado{border-left-color:var(--good)}.lanc.ignorado,.lanc.cancelado{opacity:.7}
.lanc .t{display:flex;justify-content:space-between;gap:8px}.lanc .t b{font-size:15px}.lanc .v{font:500 15px var(--num);white-space:nowrap}
.st{font-size:12px;font-weight:700}.st.fila{color:var(--warn)}.st.enviado{color:var(--accent)}.st.lancado{color:var(--good)}
.alerta{background:var(--goodbg);color:var(--good);border-radius:9px;padding:11px 13px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alerta button{border:0;background:none;color:inherit;font-weight:700}
.note{color:var(--ink3);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600}.chk input{width:20px;height:20px}
</style>
</head>
<body>
<header><h1>Lançamentos <span>LC</span></h1><div style="display:flex;gap:8px;align-items:center"><span class="net" id="net">…</span><button class="btn sec" id="b-cfg" aria-label="Configurar" style="padding:5px 9px">⚙</button></div></header>
<main>
  <div class="alerta" id="alerta" hidden><span id="alerta-t"></span><button id="alerta-x" aria-label="Fechar">✕</button></div>

  <section class="card" id="cfg" hidden>
    <h2>Configurar este celular</h2>
    <p class="note" style="margin:0">Preencha uma vez. O link e a senha são os da sua planilha do Google (veja COMO_INSTALAR.txt).</p>
    <label>Seu nome<input id="c-nome" placeholder="Caio ou Luiz"></label>
    <label>Link do app da Web (termina em /exec)<input id="c-url" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"></label>
    <label>Senha<input id="c-sen" type="password"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="c-ok">Salvar e testar</button><button class="btn sec" id="c-not">Ativar avisos</button></div>
    <div class="msg" id="c-msg" hidden></div>
  </section>

  <form class="card" id="f-venda" autocomplete="off">
    <h2>Venda</h2>
    <label>Cliente<input id="v-cli" placeholder="Nome do cliente ou empresa"></label>
    <div class="row"><label>Telefone<input id="v-tel" inputmode="tel"></label><label>Cidade / local<input id="v-loc" placeholder="Canoinhas"></label></div>
    <div><div class="lbl">Empresa / nota</div><div class="seg" id="v-emp"><button type="button" data-v="Marilete">Marilete</button><button type="button" data-v="Dayane">Dayane</button><button type="button" data-v="Luiz">Luiz</button><button type="button" data-v="Sem nota">Sem nota</button></div></div>
    <div><div class="lbl">Peças e materiais</div>
      <div class="item note" style="font-weight:600"><span>Descrição</span><span>Qtd</span><span>Valor un.</span><span></span></div>
      <div id="v-itens" style="display:grid;gap:8px"></div><button type="button" class="add" id="v-add">+ adicionar item</button></div>
    <div class="row"><label>Mão de obra (R$)<input id="v-mo" inputmode="decimal" placeholder="0,00"></label><label>Serviço feito<input id="v-mod"></label></div>
    <div class="row"><label>Pagamento<select id="v-pag"><option value="">—</option><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>A prazo</option></select></label>
      <label class="chk" style="align-self:end"><input type="checkbox" id="v-pago"> Já recebido</label></div>
    <label>Observação<textarea id="v-obs"></textarea></label>
    <div class="tot"><span class="note">Total</span><b id="v-tot">R$ 0,00</b></div>
    <button class="btn" type="submit">Salvar venda</button>
    <div class="msg" id="v-msg" hidden></div>
  </form>

  <form class="card" id="f-gasto" autocomplete="off" hidden>
    <h2>Gasto</h2>
    <div><div class="lbl">De quem é o gasto</div><div class="seg" id="g-nat"><button type="button" data-v="Empresa" aria-pressed="true">Empresa</button><button type="button" data-v="Pessoal" aria-pressed="false">Pessoal</button></div></div>
    <div><div class="lbl">Categoria</div><div class="seg" id="g-cat"></div></div>
    <label>Descrição / onde<input id="g-desc" placeholder="Posto Zaka, Farmácia Trevisani…"></label>
    <div class="row"><label>Valor (R$)<input id="g-val" inputmode="decimal" placeholder="0,00"></label>
      <label>Pagamento<select id="g-pag"><option value="">—</option><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>A prazo</option></select></label></div>
    <label class="chk"><input type="checkbox" id="g-pago" checked> Já pago</label>
    <div><div class="lbl">Comprovante (foto)</div><div class="foto"><label class="btn sec" style="display:inline-block;cursor:pointer">Tirar / escolher foto<input type="file" id="g-foto" accept="image/*" capture="environment" hidden></label><img id="g-prev" alt="" hidden><button type="button" class="x" id="g-fx" hidden aria-label="Remover foto">×</button></div></div>
    <label>Observação<textarea id="g-obs" placeholder="km do carro, placa, o que foi feito…"></textarea></label>
    <button class="btn" type="submit">Salvar gasto</button>
    <div class="msg" id="g-msg" hidden></div>
  </form>

  <section class="card" id="lista" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Meus lançamentos</h2><button class="btn sec" id="l-sync">Atualizar</button></div>
    <p class="note" style="margin:0" id="l-res"></p>
    <div id="l-itens" style="display:grid;gap:8px"></div>
  </section>
</main>
<nav role="tablist">
  <button role="tab" data-t="venda" aria-selected="true"><i>🧾</i>Venda</button>
  <button role="tab" data-t="gasto" aria-selected="false"><i>⛽</i>Gasto</button>
  <button role="tab" data-t="lista" aria-selected="false"><i>📋</i><span>Lançamentos<span class="badge" id="nb" hidden>0</span></span></button>
</nav>
<script>
const $=id=>document.getElementById(id);
const num=s=>{s=String(s??'').trim().replace(/R\$\s?/,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isFinite(n)?n:0;};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const refP=p=>p?' — '+(/^\d+$/.test(String(p))?'pedido '+p:p):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ler=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const gravar=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } };
const CATS={Empresa:['Combustível Doblò','Manutenção Doblò','Peças / material','Ferramentas','Alimentação','Internet / telefone','Outros da empresa'],
            Pessoal:['Sítio / chácara','Mercado','Combustível Jeep','Farmácia','Casa','Animais','Outros pessoais']};
let CFG=ler('lc-cfg',{nome:'',url:'',senha:''});
// HIST: todos os lançamentos feitos neste celular {id,tipo,desc,total,criado,estado,pedido,dados?(só enquanto na fila)}
let HIST=ler('lc-hist',[]);
const salvarHist=()=>{ if(!gravar('lc-hist',HIST)){ HIST.forEach(h=>{ if(h.estado!=='fila' && h.dados) delete h.dados; }); gravar('lc-hist',HIST); } };
const novoId=()=>(Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toUpperCase();

/* ---------- navegação ---------- */
function aba(t){ document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
  $('f-venda').hidden=t!=='venda'; $('f-gasto').hidden=t!=='gasto'; $('lista').hidden=t!=='lista'; if(t==='lista'){ marcarVistos(); render(); sincronizar(); } }
document.querySelector('nav').onclick=e=>{ const b=e.target.closest('button'); if(b) aba(b.dataset.t); };
$('b-cfg').onclick=()=>{ $('cfg').hidden=!$('cfg').hidden; };
function msg(id,t,tipo){ const m=$(id); m.textContent=t; m.className='msg '+tipo; m.hidden=false; if(tipo==='ok') setTimeout(()=>m.hidden=true,5000); }

/* ---------- configuração ---------- */
$('c-nome').value=CFG.nome; $('c-url').value=CFG.url; $('c-sen').value=CFG.senha;
$('c-ok').onclick=async()=>{ CFG={nome:$('c-nome').value.trim(),url:$('c-url').value.trim(),senha:$('c-sen').value}; gravar('lc-cfg',CFG);
  if(!CFG.nome||!CFG.url){ msg('c-msg','Preencha seu nome e o link.','err'); return; }
  try{ const r=await (await fetch(CFG.url+(CFG.url.includes('?')?'&':'?')+'api=ping&senha='+encodeURIComponent(CFG.senha))).json();
    if(r.ok){ msg('c-msg','Tudo certo: este celular está ligado à sua planilha.','ok'); setTimeout(()=>$('cfg').hidden=true,1500); enviarFila(); } else msg('c-msg','A planilha respondeu: '+(r.erro||'erro')+'. Confira a senha.','err'); }
  catch(e){ msg('c-msg','Salvo. Não deu para testar agora (sem internet ou link errado). Os lançamentos ficam na fila até conseguir.','info'); } };
$('c-not').onclick=async()=>{ if(!('Notification' in window)){ msg('c-msg','Este navegador não mostra avisos. Os alertas aparecem dentro do app.','info'); return; }
  const p=await Notification.requestPermission(); msg('c-msg',p==='granted'?'Avisos ativados: você será avisado quando um lançamento for passado para o Eficaz.':'Avisos não permitidos. Os alertas continuam aparecendo dentro do app.',p==='granted'?'ok':'info'); };
if(!CFG.url||!CFG.nome) $('cfg').hidden=false;

/* ---------- venda ---------- */
function linhaItem(){ const d=document.createElement('div'); d.className='item';
  d.innerHTML='<input placeholder="descrição" aria-label="Descrição"><input inputmode="decimal" placeholder="1" aria-label="Quantidade"><input inputmode="decimal" placeholder="0,00" aria-label="Valor unitário"><button type="button" class="x" aria-label="Remover">×</button>';
  d.querySelector('.x').onclick=()=>{ d.remove(); if(!$('v-itens').children.length) $('v-itens').appendChild(linhaItem()); totV(); }; d.oninput=totV; return d; }
const segVal=id=>{ const b=[...$(id).querySelectorAll('button')].find(x=>x.getAttribute('aria-pressed')==='true'); return b?b.dataset.v:''; };
function segClick(id,obrig){ $(id).onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const on=obrig||b.getAttribute('aria-pressed')!=='true'; $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed',String(on)); if(id==='g-nat') cats(); }; }
segClick('v-emp');
function lerVenda(){ const itens=[...$('v-itens').children].map(r=>{const i=r.querySelectorAll('input'); return {desc:i[0].value.trim(),qtd:num(i[1].value)||(i[0].value.trim()?1:0),valor:num(i[2].value)};}).filter(x=>x.desc||x.valor);
  return {tipo:'venda',cliente:$('v-cli').value.trim(),telefone:$('v-tel').value.trim(),local:$('v-loc').value.trim(),empresa:segVal('v-emp'),itens,mao_obra:num($('v-mo').value),mao_obra_desc:$('v-mod').value.trim(),pagamento:$('v-pag').value,pago:$('v-pago').checked,obs:$('v-obs').value.trim()}; }
const totalVenda=v=>v.itens.reduce((s,i)=>s+i.qtd*i.valor,0)+v.mao_obra;
function totV(){ $('v-tot').textContent=brl(totalVenda(lerVenda())); }
$('v-add').onclick=()=>$('v-itens').appendChild(linhaItem());
document.addEventListener('input',e=>{ if(e.target.closest('#f-venda')) totV(); });
$('v-itens').appendChild(linhaItem());
function limparVenda(){ ['v-cli','v-tel','v-loc','v-mo','v-mod','v-obs'].forEach(i=>$(i).value=''); $('v-pag').value=''; $('v-pago').checked=false; $('v-emp').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false')); $('v-itens').innerHTML=''; $('v-itens').appendChild(linhaItem()); totV(); }
$('f-venda').addEventListener('submit',e=>{ e.preventDefault(); const v=lerVenda();
  if(!v.cliente){ msg('v-msg','Informe o cliente.','err'); return; } if(!v.itens.length&&!v.mao_obra){ msg('v-msg','Coloque um item ou a mão de obra.','err'); return; }
  registrar(v,v.cliente,totalVenda(v)); limparVenda(); });

/* ---------- gasto ---------- */
segClick('g-nat',true);
function cats(){ const n=segVal('g-nat')||'Empresa'; $('g-cat').innerHTML=CATS[n].map(c=>`<button type="button" data-v="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join(''); }
cats(); segClick('g-cat');
let FOTO='';
$('g-foto').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); const u=URL.createObjectURL(f);
  img.onload=()=>{ const m=1280, k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); FOTO=c.toDataURL('image/jpeg',0.6); $('g-prev').src=FOTO; $('g-prev').hidden=false; $('g-fx').hidden=false; URL.revokeObjectURL(u); }; img.src=u; };
$('g-fx').onclick=()=>{ FOTO=''; $('g-prev').hidden=true; $('g-fx').hidden=true; $('g-foto').value=''; };
$('f-gasto').addEventListener('submit',e=>{ e.preventDefault();
  const g={tipo:'gasto',natureza:segVal('g-nat')||'Empresa',categoria:segVal('g-cat'),descricao:$('g-desc').value.trim(),valor:num($('g-val').value),pagamento:$('g-pag').value,pago:$('g-pago').checked,obs:$('g-obs').value.trim(),foto:FOTO};
  if(!g.valor){ msg('g-msg','Informe o valor.','err'); return; } if(!g.categoria&&!g.descricao){ msg('g-msg','Escolha a categoria ou escreva a descrição.','err'); return; }
  if(!g.descricao) g.descricao=g.categoria;
  registrar(g,g.descricao,g.valor);
  ['g-desc','g-val','g-obs'].forEach(i=>$(i).value=''); $('g-pag').value=''; $('g-pago').checked=true; $('g-fx').click(); $('g-cat').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false')); });

/* ---------- fila e envio ---------- */
function registrar(dados,desc,total){
  const l={...dados,id:novoId(),criado:new Date().toISOString(),quem:CFG.nome||''};
  HIST.unshift({id:l.id,tipo:l.tipo,desc,total,criado:l.criado,estado:'fila',dados:l,cat:l.categoria||l.empresa||'',nat:l.natureza||''});
  salvarHist(); render();
  const box=dados.tipo==='venda'?'v-msg':'g-msg';
  msg(box,navigator.onLine?'Salvo. Enviando para a planilha…':'Salvo no celular. Vai ser enviado quando a internet voltar.',navigator.onLine?'ok':'info');
  enviarFila(); }
let enviando=false;
async function enviarFila(){ if(enviando||!CFG.url) return; const fila=HIST.filter(h=>h.estado==='fila'&&h.dados); if(!fila.length) return; enviando=true;
  try{ for(const h of fila){
      let r; try{ r=await (await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:'salvar',senha:CFG.senha,lancamento:h.dados})})).json(); }
      catch(e){ break; }   // sem internet: tenta depois
      if(r&&r.ok){ h.estado='enviado'; h.enviado_em=new Date().toISOString(); delete h.dados; salvarHist(); render(); }
      else { h.erro=(r&&r.erro)||'erro'; salvarHist(); render(); if(/senha/.test(h.erro)){ $('cfg').hidden=false; msg('c-msg','A planilha recusou a senha. Confira.','err'); } break; }
    } } finally { enviando=false; atualizarNet(); } }

/* ---------- status vindo do LC (lançado no Eficaz) ---------- */
async function sincronizar(){ if(!CFG.url||!navigator.onLine) return;
  try{ const r=await (await fetch(CFG.url+(CFG.url.includes('?')?'&':'?')+'api=lista&senha='+encodeURIComponent(CFG.senha))).json(); if(!r.ok) return;
    const mapa={}; (r.lancamentos||[]).forEach(x=>mapa[x.id]=x); const novos=[];
    HIST.forEach(h=>{ const x=mapa[h.id]; if(!x) return; if(h.estado==='fila'){ h.estado='enviado'; delete h.dados; }
      const st=x.status||'enviado'; if(st!==h.estado){ if(st==='lancado') novos.push(h); h.estado=st; h.pedido=x.pedido||''; h.visto=st==='lancado'?false:h.visto; } });
    salvarHist(); render();
    if(novos.length){ const t=novos.length===1?`${novos[0].desc} (${brl(novos[0].total)}) foi lançado no Eficaz${refP(novos[0].pedido)}.`:`${novos.length} lançamentos foram passados para o Eficaz.`;
      $('alerta-t').textContent='✓ '+t; $('alerta').hidden=false;
      try{ if('Notification' in window && Notification.permission==='granted'){ const reg=await navigator.serviceWorker?.getRegistration(); reg?reg.showNotification('Lançamentos LC',{body:t,icon:'icone-192.png'}):new Notification('Lançamentos LC',{body:t}); } }catch(e){} }
  }catch(e){} }
$('alerta-x').onclick=()=>{ $('alerta').hidden=true; marcarVistos(); };
function marcarVistos(){ let m=false; HIST.forEach(h=>{ if(h.estado==='lancado'&&h.visto===false){ h.visto=true; m=true; } }); if(m) salvarHist(); render(); }

/* ---------- lista ---------- */
const NOME_ST={fila:'⏳ No celular — aguardando internet',enviado:'☁ Na planilha — falta lançar no Eficaz',lancado:'✓ Lançado no Eficaz',ignorado:'Ignorado no sistema',cancelado:'Cancelado'};
function render(){
  const fila=HIST.filter(h=>h.estado==='fila').length, novos=HIST.filter(h=>h.estado==='lancado'&&h.visto===false).length;
  $('nb').textContent=fila||novos; $('nb').hidden=!(fila||novos); $('nb').style.background=fila?'var(--warn)':'var(--good)';
  const env=HIST.filter(h=>h.estado==='enviado').length, lan=HIST.filter(h=>h.estado==='lancado').length;
  $('l-res').textContent=`${fila} no celular · ${env} na planilha esperando · ${lan} lançados no Eficaz`;
  $('l-itens').innerHTML=HIST.slice(0,150).map(h=>`<div class="lanc ${esc(h.estado)}"><div class="t"><b>${h.tipo==='gasto'?'Gasto':'Venda'} · ${esc(h.desc)}</b><span class="v">${brl(h.total)}</span></div>
    <div class="note">${new Date(h.criado).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${h.cat?' · '+esc(h.cat):''}${h.nat?' · '+esc(h.nat):''}</div>
    <div class="st ${esc(h.estado)}">${NOME_ST[h.estado]||esc(h.estado)}${esc(refP(h.pedido))}${h.erro&&h.estado==='fila'?' · último erro: '+esc(h.erro):''}${h.visto===false?' · novo':''}</div></div>`).join('')||'<p class="note">Nenhum lançamento feito neste celular ainda.</p>';
}
$('l-sync').onclick=()=>{ enviarFila().then(sincronizar); };

/* ---------- conexão ---------- */
function atualizarNet(){ const f=HIST.filter(h=>h.estado==='fila').length; const n=$('net'); n.className='net '+(navigator.onLine?'on':'off'); n.textContent=(navigator.onLine?'online':'sem internet')+(f?` · ${f} na fila`:''); }
window.addEventListener('online',()=>{ atualizarNet(); enviarFila().then(sincronizar); });
window.addEventListener('offline',atualizarNet);
setInterval(()=>{ if(navigator.onLine){ enviarFila(); } },30000);
setInterval(()=>{ if(navigator.onLine && document.visibilityState==='visible') sincronizar(); },120000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&navigator.onLine){ enviarFila().then(sincronizar); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
atualizarNet(); render(); enviarFila().then(sincronizar);
</script>
